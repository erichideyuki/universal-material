<u-text-field
  label="Name"
  placeholder="Your full name"
  supporting-text="Used on your public profile"
  [(ngModel)]="name"
></u-text-field>

<u-text-field
  variant="outlined"
  label="Email"
  placeholder="you@example.com"
  supporting-text="We'll never share your email"
  type="email"
  [(ngModel)]="email"
></u-text-field>

<u-text-area
  variant="outlined"
  label="Bio"
  placeholder="Tell us about yourself"
  supporting-text="Max 200 characters"
  [(ngModel)]="bio"
></u-text-area>

<p class="u-text-low-contrast">Name: {{ name }} · Email: {{ email }}</p>
